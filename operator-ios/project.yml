name: LitterbugOperator
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  MapboxMaps:
    url: https://github.com/mapbox/mapbox-maps-ios.git
    exactVersion: 11.34.2
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 7W5GA4U4F7
targets:
  LitterbugOperator:
    type: application
    platform: iOS
    sources: [Operator/Sources]
    dependencies:
      - package: MapboxMaps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: icy.LitterbugOperator
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: LB Operator
    info:
      path: Operator/Info.plist
      properties:
        NSLocationWhenInUseUsageDescription: Shows where you are while you draw the survey area.
        NSLocalNetworkUsageDescription: Talks to the Litterbug drone on your local network.
        NSPhotoLibraryAddUsageDescription: Save flight recordings to your Photos.
        NSBonjourServices: ["_http._tcp"]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
